name: Atualizar site

# Todo dia às 02:17 (horário de Brasília = 05:17 UTC) o robô coleta os dados oficiais de novo,
# confere se vieram completos e normais e, só se passar, publica o site.
# Se a conferência reprovar, NADA é publicado: o site continua na última versão boa
# e este fluxo fica vermelho (o GitHub avisa por e-mail).
on:
  push:                       # mudou o código do robô => roda uma vez para provar que continua funcionando
    branches: [main]
    paths: ['.github/workflows/**', 'pipeline/**', 'tests/**']
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      aceitar:
        description: 'Aceitar divergências de votos contra a última versão boa (use só depois de ler o relatório)'
        type: boolean
        default: false

permissions:
  contents: write     # gravar a nova "última versão boa" em baseline/
  pages: write
  id-token: write

concurrency:
  group: atualizar-site
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Completar a cadeia de certificados da Câmara
        run: |
          pipeline/montar_certificados.sh "$RUNNER_TEMP/ca-camara.pem" | tee "$RUNNER_TEMP/certs.log"
          echo "REQUESTS_CA_BUNDLE=$RUNNER_TEMP/ca-camara.pem" >> "$GITHUB_ENV"
          echo "CURL_CA_BUNDLE=$RUNNER_TEMP/ca-camara.pem" >> "$GITHUB_ENV"
          echo "::notice title=certificados::$(tr '\n' ' ' < "$RUNNER_TEMP/certs.log")"

      - name: Testar acesso aos servidores da Câmara (com novas tentativas)
        timeout-minutes: 18
        run: |
          testar() {
            FALHOU=0
            for U in "https://www.camara.rio/includes_php/vereadores_frequencia_excel.php?ano=2026&mes=10" \
                     "https://aplicnt.camara.rj.gov.br/APL/Legislativos/scpro.nsf/Internet/LeiInt?OpenForm&Start=1&Count=3" \
                     "https://aplicnt.camara.rj.gov.br/APL/Legislativos/discvot.nsf/anoint?OpenForm&Start=1&Count=20&ExpandView"; do
              R=$(curl -sS -m 25 -o /dev/null -w "HTTP %{http_code} %{time_total}s" -A "riodejaneiro-dados/1.0" "$U" 2>&1 | tr '\n' ' ' || true)
              echo "::notice title=acesso::${U%%\?*} => $R"
              case "$R" in *"HTTP 200"*) ;; *) FALHOU=1 ;; esac
            done
            return $FALHOU
          }
          for T in 1 2 3 4 5 6; do
            if testar; then exit 0; fi
            echo "tentativa $T falhou; esperando 2,5 min"
            sleep 150
          done
          echo "::error title=Câmara inacessível::A Câmara não respondeu a este servidor do GitHub em 6 tentativas (15 min). Nada foi publicado; o site segue na última versão boa. O fluxo tenta de novo na próxima madrugada."
          exit 1

      - name: Testes dos leitores
        run: python tests/test_parsers.py

      - name: Preparar pasta de trabalho
        run: |
          mkdir -p raw
          echo "inicio $(date -u +%T)" >> raw/passos.txt
          cp baseline/canon.json raw/canon.json
          cp baseline/votos_cache.json raw/votos_cache.json

      - name: Coletar presença (faltas por mês)
        timeout-minutes: 15
        run: |
          echo "presenca inicio $(date -u +%T)" >> raw/passos.txt
          python pipeline/collect_presenca.py raw/presenca.json 2> raw/erro_presenca.log || { cat raw/erro_presenca.log; exit 1; }
          echo "presenca ok $(date -u +%T)" >> raw/passos.txt

      - name: Coletar propostas
        timeout-minutes: 45
        run: |
          echo "props inicio $(date -u +%T)" >> raw/passos.txt
          python pipeline/collect_props.py baseline/canon.json raw/props.json raw/props_estat.json 2> raw/erro_props.log || { cat raw/erro_props.log; exit 1; }
          echo "props ok $(date -u +%T)" >> raw/passos.txt

      - name: Coletar votações
        timeout-minutes: 45
        run: |
          echo "votos inicio $(date -u +%T)" >> raw/passos.txt
          python pipeline/collect_votos.py baseline/canon.json raw/votos_cache.json raw/votos.json 2> raw/erro_votos.log || { cat raw/erro_votos.log; exit 1; }
          echo "votos ok $(date -u +%T)" >> raw/passos.txt

      - name: Conferir a coleta (trava de qualidade)
        id: validar
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.aceitar }}" = "true" ] || [ -f baseline/ACEITAR_VOTOS ]; then ARGS="--aceitar"; fi
          echo "validacao inicio $(date -u +%T)" >> raw/passos.txt
          python pipeline/validate.py raw baseline raw/relatorio.md $ARGS
          echo "validacao ok $(date -u +%T)" >> raw/passos.txt

      - name: Mostrar relatório
        if: always()
        run: |
          if [ -f raw/relatorio.md ]; then cat raw/relatorio.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f raw/props_estat.json ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"; echo '## Estatísticas das propostas' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat raw/props_estat.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar estado da execução no branch 'execucao'
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in raw/passos.txt raw/relatorio.md raw/erro_presenca.log raw/erro_props.log raw/erro_votos.log raw/props_estat.json raw/votos_debug.json; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          git commit -q -m "estado da execução $(date -u +%FT%TZ)" || true
          git push -f origin HEAD:execucao || true

      - name: Guardar relatório no repositório (mesmo quando reprova)
        if: always()
        run: |
          mkdir -p relatorios
          cp raw/relatorio.md relatorios/ultima-execucao.md 2>/dev/null || true
          cp raw/props_estat.json relatorios/ 2>/dev/null || true
          cp raw/votos_debug.json relatorios/ 2>/dev/null || true
          for f in raw/erro_*.log; do [ -s "$f" ] && cp "$f" relatorios/ || true; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorios
          if git diff --cached --quiet; then echo "sem mudanças"; else
            git commit -m "Relatório da execução de $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Gerar o site
        run: python pipeline/build.py raw _site

      - name: Testar o site gerado num navegador
        run: python tests/smoke.py _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Guardar como nova "última versão boa"
        run: |
          python pipeline/update_baseline.py raw baseline
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline
          if git diff --cached --quiet; then echo "sem mudanças"; else
            git commit -m "Atualiza última versão boa ($(date -u +%F)) [skip ci]"
            git push
          fi
